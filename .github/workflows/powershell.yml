name: PowerShell validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: powershell
        run: .\tests\validate-repo.ps1
      - name: Hook handler contract tests
        shell: powershell
        run: .\tests\handler-contract.ps1 -Suite contract
      - name: Notifier contract tests
        shell: powershell
        run: .\tests\notify-contract.ps1 -Suite contract
      - name: Turn duration contract tests
        shell: powershell
        run: .\tests\duration-contract.ps1 -Suite contract
      - name: Project label contract tests
        shell: powershell
        run: .\tests\project-label-contract.ps1 -Suite contract
      - name: Install lifecycle tests
        shell: powershell
        run: .\tests\lifecycle-contract.ps1 -Suite lifecycle
